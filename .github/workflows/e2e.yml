name: Android E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PUB_SUMMARY_ONLY: true

jobs:
  screenshots:
    name: Screenshots (${{ matrix.device_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - device_type: phoneScreenshots
            profile: pixel_6
          - device_type: sevenInchScreenshots
            profile: Nexus 7
          - device_type: tenInchScreenshots
            profile: Nexus 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        run: |
          echo "$GITHUB_WORKSPACE/flutter/bin" >> "$GITHUB_PATH"
          flutter --version
          flutter config --no-analytics

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate screenshots
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MARKET_MONK_DEVICE_TYPE: ${{ matrix.device_type }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: ./scripts/ci-screenshots.sh

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.device_type }}
          path: fastlane/metadata/android/en-US/images/${{ matrix.device_type }}
          if-no-files-found: error
          retention-days: 7

  patrol:
    name: Patrol Android system tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        run: |
          echo "$GITHUB_WORKSPACE/flutter/bin" >> "$GITHUB_PATH"
          flutter --version
          flutter config --no-analytics

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Install Patrol CLI
        run: |
          dart pub global activate patrol_cli 4.7.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Patrol tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: patrol test -t patrol_test/android_system_test.dart
