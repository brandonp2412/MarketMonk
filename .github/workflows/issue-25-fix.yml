name: Implement issue 25 currency provenance

on:
  push:
    branches: [fix/issue-25-currency-provenance]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply currency provenance fix
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one match in {path}: {old[:80]!r}')
              path.write_text(text.replace(old, new, 1))

          utils = Path('lib/utils.dart')
          replace_once(
              utils,
              "Map<String, double> allRatesFromUsd = {'USD': 1.0};\n\n/// The current USD → displayCurrency conversion factor.\ndouble get exchangeRate =>\n    allRatesFromUsd[currency.currencyName ?? 'USD'] ?? 1.0;",
              "Map<String, double> allRatesFromUsd = {'USD': 1.0};\n\n/// Returns the USD-based exchange rate for [currencyCode].\n///\n/// A missing rate is an unavailable valuation, never evidence of a 1:1 USD\n/// rate. Failing closed prevents foreign holdings from being multiplied by an\n/// unrelated display-currency rate.\ndouble requireUsdRate(String currencyCode) {\n  final rate = allRatesFromUsd[currencyCode];\n  if (rate == null || rate <= 0 || !rate.isFinite) {\n    throw StateError('Exchange rate unavailable for $currencyCode');\n  }\n  return rate;\n}\n\n/// The current USD → displayCurrency conversion factor.\ndouble get exchangeRate => requireUsdRate(currency.currencyName ?? 'USD');",
          )
          replace_once(
              utils,
              "String fmtNativeCurrency(double v, String nativeCurrency) {\n  final nativeRate = allRatesFromUsd[nativeCurrency] ?? 1.0;\n  return fmtCurrency(v / nativeRate);\n}",
              "String fmtNativeCurrency(double v, String nativeCurrency) {\n  final nativeRate = requireUsdRate(nativeCurrency);\n  return fmtCurrency(v / nativeRate);\n}",
          )
          replace_once(
              utils,
              "String fmtCompactNativeCurrency(double v, String nativeCurrency) {\n  final nativeRate = allRatesFromUsd[nativeCurrency] ?? 1.0;\n  return fmtCompactCurrency(v / nativeRate);\n}",
              "String fmtCompactNativeCurrency(double v, String nativeCurrency) {\n  final nativeRate = requireUsdRate(nativeCurrency);\n  return fmtCompactCurrency(v / nativeRate);\n}",
          )
          replace_once(
              utils,
              "  double get _nativeToUsd => 1.0 / (allRatesFromUsd[nativeCurrency] ?? 1.0);",
              "  double get _nativeToUsd => 1.0 / requireUsdRate(nativeCurrency);",
          )
          replace_once(
              utils,
              "  for (final position in stockPositions) {\n    cacheSymbolMeta(position.symbol, position.currency);\n    if (position.currency != 'USD' &&\n        !allRatesFromUsd.containsKey(position.currency)) {\n      await _fetchAndCacheRate(position.currency);\n    }\n  }",
              "  for (final position in stockPositions) {\n    final nativeCurrency = cacheSymbolMeta(\n      position.symbol,\n      position.currency,\n    );\n    if (nativeCurrency != 'USD' &&\n        !allRatesFromUsd.containsKey(nativeCurrency)) {\n      await _fetchAndCacheRate(nativeCurrency);\n    }\n    requireUsdRate(nativeCurrency);\n  }",
          )
          replace_once(
              utils,
              "        nativeCurrency: symbolCurrency(symbol),",
              "        nativeCurrency: _symbolCurrencies[symbol] ?? 'UNKNOWN',",
          )
          replace_once(
              utils,
              "  await Future.wait(symbols.map(fetchSymbolCurrencyAndRate));",
              "  await Future.wait(symbols.map((symbol) async {\n    await fetchSymbolCurrencyAndRate(symbol);\n    final nativeCurrency = _symbolCurrencies[symbol];\n    if (nativeCurrency == null || nativeCurrency.isEmpty) {\n      throw StateError('Currency metadata unavailable for $symbol');\n    }\n    requireUsdRate(nativeCurrency);\n  }));",
          )
          replace_once(
              utils,
              "    if (normalized != 'USD' && !allRatesFromUsd.containsKey(normalized)) {\n      final savedRate = prefs.getDouble('exchangeRate_$normalized');\n      if (savedRate != null) allRatesFromUsd[normalized] = savedRate;\n      unawaited(_fetchAndCacheRate(normalized));\n    }\n    return;",
              "    if (normalized != 'USD' && !allRatesFromUsd.containsKey(normalized)) {\n      final savedRate = prefs.getDouble('exchangeRate_$normalized');\n      if (savedRate != null) {\n        allRatesFromUsd[normalized] = savedRate;\n        unawaited(_fetchAndCacheRate(normalized));\n      } else {\n        await _fetchAndCacheRate(normalized);\n      }\n    }\n    return;",
          )

          tests = Path('test/bug_fixes_test.dart')
          text = tests.read_text()
          marker = "\n  group('average cost after sells', () {"
          if marker not in text:
              raise SystemExit('Could not find bug_fixes_test insertion point')
          block = base64.b64decode(' '.replace(' ', '')).decode()
          tests.write_text(text.replace(marker, '\n' + block + marker, 1))
          PY

      - name: Setup Flutter from submodule
        run: |
          export PATH="$PATH:$PWD/flutter/bin"
          echo "$PWD/flutter/bin" >> "$GITHUB_PATH"
          flutter --version
          flutter config --no-analytics

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Format changed Dart files
        run: dart format lib/utils.dart test/bug_fixes_test.dart

      - name: Analyze
        run: dart analyze --no-fatal-warnings lib

      - name: Run tests
        run: flutter test

      - name: Commit implementation
        run: |
          rm .github/workflows/issue-25-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/utils.dart test/bug_fixes_test.dart .github/workflows/issue-25-fix.yml
          git diff --cached --check
          git commit -m "fix: fail closed on unknown holding currencies (#25)"
          git push origin HEAD
