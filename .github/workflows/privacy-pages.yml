name: MarketMonk Pages

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Commit to publish for this manual web hotfix
        required: true
        type: string
  workflow_call:
    inputs:
      release_commit:
        description: Commit published by the manual release workflow
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.release_commit }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build Flutter web
        run: |
          flutter/bin/flutter --version
          flutter/bin/flutter config --no-analytics
          flutter/bin/flutter pub get --enforce-lockfile
          flutter/bin/flutter build web --release --base-href /MarketMonk/ --dart-define=MARKET_MONK_FINANCE_BASE_URL=https://marketmonk-finance.brandonp2412.workers.dev

      - name: Preserve published documentation
        run: |
          cp -r docs/. build/web/
          test -s build/web/index.html
          test -s build/web/privacy-policy.html
          test -s build/web/sqlite3.wasm
          test -s build/web/drift_worker.dart.js

      - name: Upload web app and documentation
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./build/web

      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..15}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' | grep -q '[0-9]'; then
              exit 0
            fi
            sleep 4
          done
          echo "::error::Pages artifact did not become visible"
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
