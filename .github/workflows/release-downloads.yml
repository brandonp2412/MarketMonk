name: Update release badges

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-downloads-badge
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - name: Install locked badge renderer
        run: npm ci --prefix scripts/badges --ignore-scripts
      - name: Update badges
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/badges/update.mjs
          if git diff --quiet -- docs/release-downloads.svg docs/release.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/release-downloads.svg docs/release.svg
          git commit -m "docs: refresh release badges"
          git push origin HEAD:main
