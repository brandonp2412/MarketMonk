name: Update release downloads badge

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-downloads-badge
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - name: Update badge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/update_release_downloads.py
          if git diff --quiet -- docs/release-downloads.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/release-downloads.svg
          git commit -m "docs: refresh release downloads badge"
          git push origin HEAD:main
