name: Build and Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "pubspec.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Flutter from submodule
        run: |
          export PATH="$PATH:$PWD/flutter/bin"
          echo "$PWD/flutter/bin" >> "$GITHUB_PATH"
          flutter --version
          flutter config --no-analytics
          flutter precache

      - name: Get dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build -d

      - name: Verify formatting
        run: dart format lib test

      - name: Analyze code
        run: dart analyze --no-fatal-warnings lib

      - name: Run tests
        run: flutter test

  screenshots:
    name: Screenshots (${{ matrix.device_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - device_type: phoneScreenshots
            profile: pixel_6
          - device_type: sevenInchScreenshots
            profile: Nexus 7
            screen_size: 1920x1080
          - device_type: tenInchScreenshots
            profile: Nexus 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        run: |
          chmod +x flutter/bin/*
          export PATH="$GITHUB_WORKSPACE/flutter/bin:$PATH"
          echo "$GITHUB_WORKSPACE/flutter/bin" >> "$GITHUB_PATH"
          flutter --version
          flutter config --no-analytics

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate screenshots
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          MARKET_MONK_DEVICE_TYPE: ${{ matrix.device_type }}
          SCREENSHOT_SCREEN_SIZE: ${{ matrix.screen_size }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: ./scripts/ci-screenshots.sh

      - name: Upload screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots-${{ matrix.device_type }}
          path: fastlane/metadata/android/en-US/images/${{ matrix.device_type }}
          if-no-files-found: error
          retention-days: 7

  patrol:
    name: Patrol Android system tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        run: |
          chmod +x flutter/bin/*
          export PATH="$GITHUB_WORKSPACE/flutter/bin:$PATH"
          echo "$GITHUB_WORKSPACE/flutter/bin" >> "$GITHUB_PATH"
          flutter --version
          flutter config --no-analytics

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Install Patrol CLI
        run: |
          dart pub global activate patrol_cli 4.7.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Patrol tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: patrol test -t patrol_test/android_system_test.dart

  version-bump:
    needs: [quality-checks, screenshots, patrol]
    if: ${{ always() && needs.quality-checks.result == 'success' && needs.patrol.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      commit_sha: ${{ steps.release.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Get current version from pubspec.yaml
        id: current_version
        run: |
          # A previous queued run may have bumped main after this run started.
          # Version from the latest main so releases never reuse an existing tag.
          git pull --ff-only origin main
          CURRENT_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          CURRENT_BUILD_NUMBER=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "current_build_number=$CURRENT_BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Current version: $CURRENT_VERSION+$CURRENT_BUILD_NUMBER"

      - name: Download phone screenshots
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: screenshots-phoneScreenshots
          path: fastlane/metadata/android/en-US/images/phoneScreenshots

      - name: Download seven-inch screenshots
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: screenshots-sevenInchScreenshots
          path: fastlane/metadata/android/en-US/images/sevenInchScreenshots

      - name: Download ten-inch screenshots
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: screenshots-tenInchScreenshots
          path: fastlane/metadata/android/en-US/images/tenInchScreenshots

      - name: Bump version
        id: version
        env:
          CURRENT_VERSION: ${{ steps.current_version.outputs.current_version }}
          CURRENT_BUILD_NUMBER: ${{ steps.current_version.outputs.current_build_number }}
        run: |
          IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}
          PATCH=$((PATCH + 1))

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          NEW_BUILD_NUMBER=$((CURRENT_BUILD_NUMBER + 1))
          CURRENT_MSIX_VERSION=$(grep 'msix_version:' pubspec.yaml | sed 's/.*msix_version: *//')
          IFS='.' read -ra MSIX_VERSION_PARTS <<< "$CURRENT_MSIX_VERSION"
          NEW_MSIX_VERSION="${MSIX_VERSION_PARTS[0]}.${MSIX_VERSION_PARTS[1]}.$((${MSIX_VERSION_PARTS[2]} + 1)).${MSIX_VERSION_PARTS[3]}"

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$NEW_BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW_VERSION+$NEW_BUILD_NUMBER"

          sed -i "s/^version: .*/version: $NEW_VERSION+$NEW_BUILD_NUMBER/" pubspec.yaml
          sed -i "s/msix_version: .*/msix_version: $NEW_MSIX_VERSION/" pubspec.yaml
          echo "Updated pubspec.yaml with new app and MSIX versions"

      - name: Generate changelog
        id: changelog
        run: |
          TIMESTAMP=$(date +%s)
          ASSET_CHANGELOG="assets/changelogs/${TIMESTAMP}.txt"
          mkdir -p assets/changelogs

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            RANGE="$LAST_TAG..HEAD"
          else
            RANGE="HEAD"
          fi

          git --no-pager log --pretty=format:'%s' $RANGE | \
            sort -u | \
            grep -v "^Merge " | \
            grep -v "^Bump " | \
            grep -v "\[skip ci\]" | \
            grep -v "^ci:" | \
            grep -v "^chore:" | \
            grep -v "^test:" | \
            grep -v "^refactor:" | \
            grep -v "^style:" | \
            grep -v "^docs:" | \
            grep -v "^build:" | \
            grep -v "^Generate " | \
            grep -v "^Format " | \
            grep -v "^Ran " | \
            grep -v "^Run " | \
            grep -v "^Fix dart format" | \
            grep -v "^Fix tests" | \
            grep -v "^Fix lint" | \
            grep -v "^Fix formatting" | \
            grep -v "^Update android" | \
            grep -v "^Update flutter" | \
            grep -v "^Update screenshots" | \
            grep -v "^Add CLAUDE" | \
            grep -v "^Revert " | \
            head -10 | \
            sed 's/^feat: //' | \
            sed 's/^fix: /Fix /' | \
            sed 's/^perf: //' | \
            sed 's/^/• /' > "$ASSET_CHANGELOG"

          if [ ! -s "$ASSET_CHANGELOG" ]; then
            echo "• Bug fixes and improvements" > "$ASSET_CHANGELOG"
          fi

          # Deduplicate: skip if first line matches any existing changelog
          FIRST_LINE=$(head -1 "$ASSET_CHANGELOG" | sed 's/[.[\*^$()+?{|]/\\&/g')
          DUPLICATE=$(grep -rl "^${FIRST_LINE}$" assets/changelogs/ 2>/dev/null | grep -v "$ASSET_CHANGELOG" | head -1)
          if [ -n "$DUPLICATE" ]; then
            echo "Skipping duplicate changelog (matches $DUPLICATE)"
            rm "$ASSET_CHANGELOG"
          else
            echo "asset_changelog=$ASSET_CHANGELOG" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push version bump
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          git add pubspec.yaml assets/changelogs/ fastlane/metadata/android/en-US/images/
          git commit -m "Bump version to ${RELEASE_VERSION}+${RELEASE_BUILD_NUMBER} [skip ci]"
          gh auth setup-git
          git pull --rebase origin main
          git push origin main
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag -a "v${RELEASE_VERSION}" -m "Release version ${RELEASE_VERSION}"
          gh auth setup-git
          git push origin "v${RELEASE_VERSION}"

  build-android:
    needs: version-bump
    runs-on: ubuntu-latest
    # PUB_CACHE must match fdroiddata's `export PUB_CACHE=$(pwd)/.pub-cache` so that
    # package source paths in debug info are identical.
    # ANDROID_HOME is normalized to /opt/android-sdk by the Normalize step below so
    # that native toolchain paths embedded in libdartjni.so debug info match fdroiddata.
    env:
      PUB_CACHE: /home/brandon/market_monk/.pub-cache
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      # Build from /home/brandon/market_monk to match fdroiddata reproducible build path,
      # so the dart_plugin_registrant.dart file URI embedded in libapp.so is identical.
      # Use cp -al (hardlink copy) so $GITHUB_WORKSPACE still exists for Actions internals.
      - name: Create fdroiddata build path
        run: |
          sudo mkdir -p /home/brandon
          sudo cp -al "$GITHUB_WORKSPACE" /home/brandon/market_monk
          sudo chown -R runner:runner /home/brandon/market_monk

      # Normalize the Android SDK path to /opt/android-sdk so that native compilation
      # paths (embedded in libdartjni.so debug info and thus the build ID) are identical
      # between GitHub Actions and the fdroiddata build server.
      - name: Normalize Android SDK path
        run: |
          sudo mkdir -p /opt/android-sdk
          sudo cp -a "$ANDROID_HOME/." /opt/android-sdk/
          echo "ANDROID_HOME=/opt/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter from submodule
        working-directory: /home/brandon/market_monk
        run: |
          export PATH="$PATH:/home/brandon/market_monk/flutter/bin"
          echo "/home/brandon/market_monk/flutter/bin" >> "$GITHUB_PATH"
          flutter --version
          flutter config --no-analytics
          flutter precache

      - name: Get dependencies
        working-directory: /home/brandon/market_monk
        run: flutter pub get

      - name: Run build_runner
        working-directory: /home/brandon/market_monk
        run: dart run build_runner build -d

      - name: Decode Android keystore
        working-directory: /home/brandon/market_monk
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -di > android/app/keystore.jks
          echo "storePassword=$ANDROID_STORE_PASSWORD" > android/key.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> android/key.properties
          echo "storeFile=keystore.jks" >> android/key.properties

      - name: Build APK for x86_64
        working-directory: /home/brandon/market_monk
        run: flutter build apk --release --build-name=${{ needs.version-bump.outputs.version }} --build-number=${{ needs.version-bump.outputs.build_number }} --target-platform android-x64 --split-per-abi

      - name: Build APK for armeabi-v7a
        working-directory: /home/brandon/market_monk
        run: flutter build apk --release --build-name=${{ needs.version-bump.outputs.version }} --build-number=${{ needs.version-bump.outputs.build_number }} --target-platform android-arm --split-per-abi

      - name: Build APK for arm64-v8a
        working-directory: /home/brandon/market_monk
        run: flutter build apk --release --build-name=${{ needs.version-bump.outputs.version }} --build-number=${{ needs.version-bump.outputs.build_number }} --target-platform android-arm64 --split-per-abi

      - name: Build universal APK
        working-directory: /home/brandon/market_monk
        run: |
          flutter build apk --release --build-name=${{ needs.version-bump.outputs.version }} --build-number=${{ needs.version-bump.outputs.build_number }}
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/market_monk.apk

      - name: Build App Bundle
        working-directory: /home/brandon/market_monk
        run: flutter build appbundle --release --build-name=${{ needs.version-bump.outputs.version }} --build-number=${{ needs.version-bump.outputs.build_number }}

      - name: Upload APK artifact
        if: github.actor != 'nektos/act'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          retention-days: 7
          name: android-apk
          path: |
            /home/brandon/market_monk/build/app/outputs/flutter-apk/app-*-release.apk
            /home/brandon/market_monk/build/app/outputs/flutter-apk/market_monk.apk

      - name: Upload AAB artifact
        if: github.actor != 'nektos/act'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          retention-days: 7
          name: android-aab
          path: /home/brandon/market_monk/build/app/outputs/bundle/release/app-release.aab

  build-linux:
    needs: version-bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Setup Flutter from submodule
        run: |
          export PATH="$PATH:$PWD/flutter/bin"
          echo "$PWD/flutter/bin" >> "$GITHUB_PATH"
          flutter --version
          flutter config --no-analytics
          flutter precache --linux

      - name: Get dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build -d

      - name: Build Linux
        run: flutter build linux --release --build-name=${{ needs.version-bump.outputs.version }} --build-number=${{ needs.version-bump.outputs.build_number }}

      - name: Create Linux archive
        run: |
          cd build/linux/x64/release/bundle
          zip -r ../../../../../market_monk-linux-${{ needs.version-bump.outputs.version }}.zip .

      - name: Upload Linux artifact
        if: github.actor != 'nektos/act'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          retention-days: 7
          name: linux-app
          path: market_monk-linux-${{ needs.version-bump.outputs.version }}.zip

  build-windows:
    needs: version-bump
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Flutter from submodule
        run: |
          $env:PATH = "$env:PATH;$PWD\flutter\bin"
          echo "$PWD\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          flutter --version
          flutter config --no-analytics
          flutter precache --windows

      - name: Get dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build -d

      - name: Build Windows
        run: flutter build windows --release --build-name=${{ needs.version-bump.outputs.version }} --build-number=${{ needs.version-bump.outputs.build_number }}

      - name: Create Windows archive
        run: |
          cd build/windows/x64/runner/Release
          7z a ../../../../../market_monk-windows-${{ needs.version-bump.outputs.version }}.zip *

      - name: Upload Windows artifact
        if: github.actor != 'nektos/act'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          retention-days: 7
          name: windows-app
          path: market_monk-windows-${{ needs.version-bump.outputs.version }}.zip

  deploy-windows-store:
    needs: [version-bump, build-windows]
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.version-bump.outputs.commit_sha }}
          persist-credentials: false

      - name: Setup Flutter from submodule
        run: |
          git submodule update --init --recursive flutter
          echo "$env:GITHUB_WORKSPACE\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          flutter\bin\flutter config --no-analytics

      - name: Get Flutter dependencies
        run: flutter\bin\flutter pub get --enforce-lockfile

      - name: Build MSIX
        run: flutter pub run msix:create

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "9.0.x"

      - name: Setup Microsoft Store CLI
        uses: microsoft/setup-msstore-cli@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4

      - name: Configure Microsoft Store CLI
        env:
          MSSTORE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
        run: msstore reconfigure --tenantId $env:MSSTORE_TENANT_ID --clientId $env:MSSTORE_CLIENT_ID --clientSecret $env:MSSTORE_CLIENT_SECRET --sellerId $env:MSSTORE_SELLER_ID

      - name: Prepare Microsoft Store for submission
        shell: pwsh
        env:
          PRODUCT_ID: ${{ secrets.PRODUCT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          # Microsoft requires an active package rollout to be finalized before creating a new submission:
          # https://learn.microsoft.com/en-us/windows/apps/publish/gradual-package-rollout
          $token = Invoke-RestMethod `
            -Method Post `
            -Uri "https://login.microsoftonline.com/$env:TENANT_ID/oauth2/token" `
            -ContentType "application/x-www-form-urlencoded" `
            -Body @{
              grant_type = "client_credentials"
              client_id = $env:CLIENT_ID
              client_secret = $env:CLIENT_SECRET
              resource = "https://manage.devcenter.microsoft.com"
            }
          $headers = @{ Authorization = "Bearer $($token.access_token)" }
          $appUrl = "https://manage.devcenter.microsoft.com/v1.0/my/applications/$env:PRODUCT_ID"
          $failedStatuses = @("CommitFailed", "PreProcessingFailed", "CertificationFailed", "ReleaseFailed", "PublishFailed")
          $pendingDeadline = (Get-Date).AddMinutes(45)

          while ($true) {
            $app = Invoke-RestMethod -Headers $headers -Uri $appUrl
            $pendingId = $app.pendingApplicationSubmission.id
            if ([string]::IsNullOrWhiteSpace($pendingId)) {
              break
            }

            $pending = Invoke-RestMethod -Headers $headers -Uri "$appUrl/submissions/$pendingId"
            Write-Host "Existing Store submission $pendingId status=$($pending.status)"
            if ($pending.status -in $failedStatuses) {
              Write-Host "Existing submission is failed; msstore will replace it."
              break
            }
            if ((Get-Date) -ge $pendingDeadline) {
              throw "Timed out waiting for the existing Microsoft Store submission to finish."
            }
            Start-Sleep -Seconds 30
          }

          $app = Invoke-RestMethod -Headers $headers -Uri $appUrl
          $submissionId = $app.lastPublishedApplicationSubmission.id
          if ([string]::IsNullOrWhiteSpace($submissionId)) {
            Write-Host "No published Store submission exists yet; no rollout to finalize."
            exit 0
          }

          $rolloutUrl = "$appUrl/submissions/$submissionId/packagerollout"
          $rollout = Invoke-RestMethod -Headers $headers -Uri $rolloutUrl
          Write-Host "Published submission rollout status=$($rollout.packageRolloutStatus) percentage=$($rollout.packageRolloutPercentage)"

          if ($rollout.packageRolloutStatus -eq "PackageRolloutInProgress") {
            $rollout = Invoke-RestMethod `
              -Method Post `
              -Headers $headers `
              -ContentType "application/json" `
              -Uri "$appUrl/submissions/$submissionId/finalizepackagerollout"
            if ($rollout.packageRolloutStatus -ne "PackageRolloutComplete") {
              throw "Microsoft Store did not complete the active package rollout."
            }
            Write-Host "Finalized active Microsoft Store package rollout."
          }

      - name: Publish to Microsoft Store
        shell: pwsh
        env:
          PRODUCT_ID: ${{ secrets.PRODUCT_ID }}
        run: |
          $packages = @(Get-ChildItem -Path "build/windows/x64/runner/Release" -Filter "*.msix" -File -Recurse)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one generated MSIX package, found $($packages.Count)."
          }

          $package = $packages[0]
          $packageDirectory = $package.Directory.FullName
          Write-Host "Publishing $($package.FullName) to Microsoft Store product $env:PRODUCT_ID"
          & msstore publish . --inputDirectory $packageDirectory --appId $env:PRODUCT_ID
          if ($LASTEXITCODE -ne 0) {
            throw "Microsoft Store publish failed with exit code $LASTEXITCODE."
          }

          Write-Host "Verifying Microsoft Store submission status"
          & msstore submission status $env:PRODUCT_ID
          if ($LASTEXITCODE -ne 0) {
            throw "Microsoft Store submission status verification failed with exit code $LASTEXITCODE."
          }

  create-release:
    needs: [version-bump, build-android, build-linux, build-windows, publish-google-play]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.version-bump.outputs.version }}
          name: Market Monk v${{ needs.version-bump.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            artifacts/android-apk/app-*-release.apk
            artifacts/android-apk/market_monk.apk
            artifacts/android-aab/app-release.aab
            artifacts/linux-app/market_monk-linux-${{ needs.version-bump.outputs.version }}.zip
            artifacts/windows-app/market_monk-windows-${{ needs.version-bump.outputs.version }}.zip

  publish-google-play:
    needs: [version-bump, build-android]
    if: ${{ github.ref == 'refs/heads/main' && needs.version-bump.result == 'success' && needs.build-android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.version-bump.outputs.commit_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-aab
          path: android-aab

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Configure Google Play credentials
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/googlePlay.json"

      - name: Publish Android App Bundle to Google Play
        run: |
          bundle exec fastlane supply \
            --aab android-aab/app-release.aab \
            --track production \
            --package_name com.codesail.market_monk \
            --json_key "$RUNNER_TEMP/googlePlay.json" \
            --release_status completed \
            --skip_upload_metadata true \
            --skip_upload_images true \
            --skip_upload_screenshots true \
            --skip_upload_changelogs true

  virustotal:
    needs: [create-release, version-bump]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download Android artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-apk
          path: android-apk

      - name: VirusTotal Scan
        id: vt
        continue-on-error: true
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5.0.0
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            android-apk/app-arm64-v8a-release.apk
            android-apk/app-armeabi-v7a-release.apk
            android-apk/app-x86_64-release.apk

      - name: Append VirusTotal links to release
        if: steps.vt.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v${{ needs.version-bump.outputs.version }}
          ANALYSIS: ${{ steps.vt.outputs.analysis }}
          REPOSITORY: ${{ github.repository }}
        run: |
          VT_SECTION=$'\n\n<details>\n<summary>VirusTotal Analysis</summary>\n\n'
          IFS=',' read -ra ENTRIES <<< "$ANALYSIS"
          for entry in "${ENTRIES[@]}"; do
            filename=$(basename "${entry%%=*}")
            url="${entry#*=}"
            VT_SECTION+="- [${filename}](${url})"$'\n'
          done
          VT_SECTION+=$'\n</details>'
          CURRENT_BODY=$(gh release view "$VERSION" --repo "$REPOSITORY" --json body -q .body)
          gh release edit "$VERSION" --repo "$REPOSITORY" --notes "${CURRENT_BODY}${VT_SECTION}"
