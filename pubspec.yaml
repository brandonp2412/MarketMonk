name: market_monk
description: Track stocks quickly and easily
version: 1.0.113+114
environment:
  sdk: ^3.5.4
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  talker_flutter: 5.1.20
  archive: ^4.0.9
  csv: ^8.0.0
  cupertino_icons: ^2.0.0
  yahoo_finance_data_reader: ^1.0.11
  drafter: ^0.3.0
